[project]
name = "mboyo-ml-api"
version = "0.1.0"
description = "MBOYO computer-vision inference API (FastAPI) — internal-token gated, no public ingress."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() pattern requires calls in argument
# defaults by design — this is idiomatic FastAPI, not a real mutable-default bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# onnxruntime ships no py.typed marker/stubs — its public API is still
# checked via our own call-site type annotations, but mypy cannot verify
# its internals, matching ml/pyproject.toml's identical exception for the
# same reason.
[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
